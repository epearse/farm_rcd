farm_sli.intake:
  path: '/intake'
  defaults:
    _form: 'Drupal\farm_sli\Form\IntakeForm'
    _title: Intake form
  requirements:
    _custom_access: '\Drupal\farm_sli\Form\IntakeForm::access'

farm_sli.settings:
  path: 'farm/settings/sli'
  defaults:
    _form: '\Drupal\farm_sli\Form\SettingsForm'
    _title: 'SLI settings'
  requirements:
    _permission: 'administer sli'
