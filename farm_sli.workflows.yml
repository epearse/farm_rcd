rcp_workflow:
  id: rcp_workflow
  group: plan
  label: 'Resource Conservation Profile Workflow'
  states:
    intake:
      label: Intake
    awaiting_funding:
      label: Awaiting funding
    received_funding:
      label: Received funding
    implementation:
      label: Implementation
    mrv:
      label: MRV
  transitions:
    intake:
      label: 'To Intake'
      from:
        - awaiting_funding
        - received_funding
        - implementation
        - mrv
      to: intake
    awaiting_funding:
      label: 'To Awaiting Funding'
      from:
        - intake
        - received_funding
        - implementation
        - mrv
      to: awaiting_funding
    received_funding:
      label: 'To Received Funding'
      from:
        - intake
        - awaiting_funding
        - implementation
        - mrv
      to: received_funding
    implementation:
      label: 'To Implementation'
      from:
        - intake
        - awaiting_funding
        - received_funding
        - mrv
      to: implementation
    mrv:
      label: 'To MRV'
      from:
        - intake
        - awaiting_funding
        - received_funding
        - implementation
      to: mrv
